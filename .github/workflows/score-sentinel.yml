name: Weekly Score Sentinel

on:
  schedule:
    # 每周一 03:23 UTC（避开整点高负载窗口）重评金标锚例，监控评分漂移
    - cron: '23 3 * * 1'
  workflow_dispatch:

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: score-sentinel
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Re-score golden anchor articles and report drift
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: npx tsx scripts/score-sentinel.ts
